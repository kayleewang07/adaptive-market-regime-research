[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adaptive-market-regime-research-platform"
version = "0.1.0"
description = "Research platform for detecting market regimes and evaluating strategies across them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kaylee Wang" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "yfinance>=0.2",
  "scikit-learn>=1.4", "hmmlearn>=0.3",
  "plotly>=5.20", "streamlit>=1.32",
  "PyYAML>=6.0", "pyarrow>=15.0", "tabulate>=0.9", "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "pandas-stubs>=2.2", "types-PyYAML>=6.0", "pre-commit>=3.7"]

[project.scripts]
amrrp = "amrrp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/amrrp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["amrrp"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "hmmlearn.*", "plotly.*", "yfinance.*", "streamlit.*", "scipy.*"]
ignore_missing_imports = true
